<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0a0908">
<title>Aiden · 日本語復習</title>
<link rel="stylesheet" href="styles.css">
<!-- 非 Apple 平台：早期注入 Zen 字体（jsDelivr）；Apple 走 Hiragino，本块 no-op -->
<script>
(function(){
  var p = navigator.platform || '', u = navigator.userAgent || '';
  if (/Mac|iPhone|iPad|iPod/.test(p) || /Macintosh|iPhone|iPad/.test(u)) return;
  var pre = document.createElement('link');
  pre.rel = 'preconnect'; pre.href = 'https://cdn.jsdelivr.net'; pre.crossOrigin = '';
  document.head.appendChild(pre);
  var CDN = 'https://cdn.jsdelivr.net/npm/@fontsource/';
  ['zen-old-mincho@5/500.css',
   'zen-old-mincho@5/700.css',
   'zen-kaku-gothic-new@5/400.css',
   'zen-kaku-gothic-new@5/500.css',
   'eb-garamond@5/latin-400-italic.css'].forEach(function(path){
    var l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = CDN + path;
    l.setAttribute('data-webfont', '1');
    document.head.appendChild(l);
  });
})();
</script>
</head>
<body>

<header>
  <div class="brand">
    <div class="seal" aria-hidden="true">和</div>
    <div class="brand-text">
      <div class="brand-title"><span class="latin-name">Aiden</span> の 日本語復習</div>
      <div class="brand-sub">Nihongo · N5–N2</div>
    </div>
  </div>
  <button class="icon-btn" id="btn-settings" aria-label="设置">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
</header>

<main>
  <nav class="module-nav" id="module-nav"></nav>
  <div class="quick-row" id="quick-row"></div>
  <div id="mount"></div>
  <div class="status" id="status"></div>
</main>

<!-- 设置 dialog -->
<dialog class="sheet" id="dlg-settings" aria-labelledby="settings-title">
  <div class="sheet-grab"></div>
  <div class="sheet-header">
    <h2 id="settings-title">設定 <span class="en">Settings</span></h2>
    <button class="icon-btn" id="settings-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M6 18L18 6"/></svg>
    </button>
  </div>
  <div class="sheet-body">
    <!-- verb 模块专用 -->
    <div class="sheet-section" id="sec-verb-level">
      <div class="sec-title">級 <span class="en">Level</span></div>
      <div class="chip-group mono" id="chip-level"></div>
    </div>
    <div class="sheet-section" id="sec-verb-type">
      <div class="sec-title">詞類 <span class="en">Class</span></div>
      <div class="chip-group" id="chip-type"></div>
    </div>
    <div class="sheet-section" id="sec-verb-conj">
      <div class="sec-title">活用 <span class="en">Conjugation</span></div>
      <div class="chip-group compact" id="chip-conj"></div>
    </div>
    <!-- grammar 模块专用 -->
    <div class="sheet-section" id="sec-gram-group">
      <div class="sec-title">機能 <span class="en">Function Group</span></div>
      <div class="chip-group" id="chip-group"></div>
    </div>
    <div class="sheet-section" id="sec-gram-mode">
      <div class="sec-title">題型 <span class="en">Question Type</span></div>
      <div class="chip-group" id="chip-mode"></div>
    </div>
    <!-- 共享 UI 选项 -->
    <div class="sheet-section">
      <div class="sec-title">表示 <span class="en">Display</span></div>
      <div id="toggles"></div>
    </div>
    <button class="reset-btn" id="reset-btn">重置進度 · Reset All</button>
  </div>
</dialog>

<!-- 统计 dialog -->
<dialog class="sheet" id="dlg-stats" aria-labelledby="stats-title">
  <div class="sheet-grab"></div>
  <div class="sheet-header">
    <h2 id="stats-title">統計 <span class="en">Statistics</span></h2>
    <button class="icon-btn" id="stats-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M6 18L18 6"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="stats-body"></div>
</dialog>

<!-- 数据 -->
<script defer src="data/verbs.js"></script>
<script defer src="data/grammar.js"></script>
<script defer src="data/grammar-time.js"></script>
<script defer src="data/grammar-cause.js"></script>
<script defer src="data/grammar-concession.js"></script>
<script defer src="data/grammar-condition.js"></script>
<script defer src="data/grammar-addition.js"></script>
<script defer src="data/grammar-emphasis.js"></script>
<script defer src="data/grammar-judgement.js"></script>
<script defer src="data/grammar-stance.js"></script>
<script defer src="data/grammar-manner.js"></script>
<script defer src="data/grammar-possibility.js"></script>
<!-- Web 字体加载控制（Apple 跳过；其他平台等下一次页面变化时切换） -->
<script defer src="js/fonts.js"></script>
<!-- 引擎与共享 -->
<script defer src="js/engine.js"></script>
<script defer src="js/state.js"></script>
<script defer src="js/ui-shared.js"></script>
<!-- 各模块 -->
<script defer src="js/module-verb.js"></script>
<script defer src="js/module-grammar.js"></script>
<script defer src="js/module-review.js"></script>
<!-- 编排器（最后） -->
<script defer src="js/app.js"></script>

</body>
</html>
